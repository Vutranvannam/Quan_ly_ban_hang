spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:

    hibernate:
      # Hibernate không tự tạo/sửa/xóa bảng
      ddl-auto: none

    open-in-view: false
    # Không generate DDL SQL
    generate-ddl: false

  sql:
    init:
      # không chạy schema.sql và data.sql khi app khởi động
      mode: never